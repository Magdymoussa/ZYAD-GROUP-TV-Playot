name: Build AMIR SAT Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'
      - name: Verify files
        shell: pwsh
        run: |
          if (!(Test-Path 'app.py')) { throw 'Missing app.py in repository root' }
          if (!(Test-Path 'amir_sat_banner.png')) { throw 'Missing amir_sat_banner.png in repository root' }
      - name: Install build dependencies
        run: python -m pip install pyinstaller==5.13.2 pillow==10.2.0 psutil==5.9.8
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-package
          $ff = Get-ChildItem ffmpeg-package -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          if (!$ff) { throw 'ffmpeg.exe not found in downloaded archive' }
          Copy-Item $ff.FullName ffmpeg.exe
          .\ffmpeg.exe -version
      - name: Build portable One Folder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name AMIR-SAT-TV-Playout --add-data 'amir_sat_banner.png;.' --add-data 'ui_icons;ui_icons' app.py
          Copy-Item ffmpeg.exe dist/AMIR-SAT-TV-Playout/ffmpeg.exe
          if (!(Test-Path 'dist/AMIR-SAT-TV-Playout/ffmpeg.exe')) { throw 'FFmpeg missing from output' }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AMIR-SAT-TV-Playout-OneFolder-Windows-x64
          path: dist/AMIR-SAT-TV-Playout/
          if-no-files-found: error
